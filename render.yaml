services:
  - type: web
    name: kick-giveaway-pro
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: KICK_CHANNEL_SLUG
        sync: false
      - key: KICK_BROADCASTER_ID
        sync: false
      - key: KICK_CLIENT_ID
        value: 01M55MY622GWQP6EA2HSJ4CJTJ
      - key: KICK_CLIENT_SECRET
        value: 1f638443bd2203d9708bf40626be7a73a68ace83e471e35bfe4584913ab386d7
      - key: KICK_ACCESS_TOKEN
        value: NWQZYTFMZJATMZHHNS0ZMTUYLTLKYZITMMEYOTQZZDA4YTK5
      - key: ADMIN_SECRET
        sync: false
      - key: OVERLAY_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/giveaway.db

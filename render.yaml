services:
  - type: web
    name: kick-giveaway-pro
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: KICK_CHANNEL_SLUG
        sync: false
      - key: KICK_BROADCASTER_ID
        sync: false
      - key: KICK_ACCESS_TOKEN
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: OVERLAY_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/giveaway.db
    # Note: Render free tier does not support persistent disks.
    # The database will persist in ./data during execution and restarts.
    # To attach a persistent disk on paid plans, uncomment below:
    # disk:
    #   name: giveaway-data
    #   mountPath: /var/data
    #   sizeGB: 1

services:
  - type: web
    name: kick-giveaway-pro
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: KICK_CHANNEL_SLUG
        value: frixen1
      - key: KICK_BROADCASTER_ID
        value: "29176855"
      - key: KICK_CLIENT_ID
        value: 01M55MY622GWQP6EA2HSJ4CJTJ
      - key: KICK_CLIENT_SECRET
        value: 4ba04b149cf41010573ec24b3d433cd32fc713b0afc80795ddf1315f933b6179
      - key: APP_URL
        value: https://kick-giveaway-pro.onrender.com
      - key: KICK_ACCESS_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: OVERLAY_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/giveaway.db
